[build-system]
# Minimum requirements for the build system to execute.
requires = ["setuptools>=61", "wheel", "packaging", "tomli;python_version<'3.11'", "setuptools_scm>8"]

build-backend = "setuptools.build_meta"

[project]
name = "imas-muscle3"
authors = [
  {name = "Mike Sanders", email = "msanders@ignitioncomputing.com"}
]
description = "IMAS MUSCLE3 tools"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.7"
license = {file = "LICENSE.md"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Plugins",
    "Framework :: Pytest",
    "Framework :: Sphinx",
# Custom trove classifiers are not allowed, and newer versions of python setuptools will fail to build
# when classifiers other than those listed on: https://pypi.org/classifiers/ are included
#    "Framework :: IMAS",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
# The license is prepended by private which makes it a valid trove classifier,
# it will also prevent uploading to package indices such as PyPI
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Unix Shell",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.15.4",
    "importlib_resources",
    "rich",
    "packaging",
    "imas-python",
    "imas-core",
    "imas-validator",
    "muscle3>=0.10",
    "ymmsl>=0.17",
    "panel",
    "holoviews",
    "hvplot",
    "xarray",
    "zarr",
    # State/BaseState/BasePlotter and the Zarr-backed recorder: shared,
    # domain-agnostic base that imas_muscle3 subclasses/wraps for IMAS.
    # Not on PyPI yet; pulled from git like ymmsl2svg is for muscle3-dashboard
    # itself.
    "muscle3-dashboard[recording] @ git+https://github.com/multiscale/muscle3-dashboard.git@feature/idle_shutdown"
]

[project.optional-dependencies]
# these self-dependencies are available since pip 21.2
all = [
    "imas-muscle3[docs,test,linting]"
]
docs = [
    "sphinx>=6.0.0,<7.0.0",
    "sphinx-autosummary-accessors>=0.1.2",
    "sphinx_immaterial>=0.11.0,<0.12",
    "recommonmark>=0.6",
]
test = [
    "pytest>=5.4.1",
    "pytest-cov>=0.6",
    "pytest-xdist",
    "pytest-randomly",
]
dashboard = [
    # Turns this venv into a fully dashboard-capable one (graph card +
    # recorder plots), on top of the [recording] pieces already required
    # unconditionally above. Not pip-installable as a plain extra -- see the
    # NOTE below -- this list exists to document/pin the exact refs needed.
    # ../../setup_files/setup_imas_muscle3.sh runs the actual recipe below.
    #
    # NOTE: `pip install -e .[dashboard]` does NOT work, with or without
    # --no-deps (the latter just skips installing the extra's deps
    # entirely). ymmsl2svg's git branch depends on ymmsl-python's
    # feature/timelines branch, which self-reports as a pre-0.17 dev version
    # despite being newer than the 0.17.0 release -- so a normal resolve of
    # this extra conflicts with this project's (and muscle3's) `ymmsl>=0.17`
    # and raises ResolutionImpossible. Instead, after the base install,
    # force-install just these two pinned refs, bypassing dependency
    # resolution so pip never has to reconcile both ymmsl constraints:
    #
    #   pip install -e .
    #   pip install "svg.py" click
    #   pip install --no-deps "ymmsl2svg @ git+https://github.com/DaanVanVugt/ymmsl2svg.git@feat/conduit-hover-labels"
    #   pip install --no-deps "ymmsl @ git+https://github.com/multiscale/ymmsl-python.git@feature/timelines"
    #
    # `pip check` will then report a (harmless, in-practice-fine)
    # ymmsl<0.17 mismatch against muscle3/imas-muscle3's declared floor.
    "ymmsl2svg @ git+https://github.com/DaanVanVugt/ymmsl2svg.git@feat/conduit-hover-labels",
]
linting = [
    "ty==0.0.53",
    "ruff~=0.15.0",
]

[project.urls]
homepage = "https://github.com/iterorganization/IMAS-MUSCLE3"

[tool.setuptools.packages.find]
where = ["."]
include = ["imas_muscle3*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers"
testpaths = "tests"

[tool.setuptools_scm]
write_to = "imas_muscle3/_version.py"
local_scheme = "no-local-version"

[tool.ruff]
extend-exclude = ["imas_muscle3/_version.py"]
line-length = 79

[tool.ruff.lint]
# E/W: pycodestyle (replaces flake8), F: pyflakes, I: isort (replaces isort tool)
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# black-compatible import sorting (equivalent to isort profile = "black")
force-sort-within-sections = false

[tool.ruff.format]
# black-compatible formatter; line-length inherited from [tool.ruff]

[tool.ty.src]
include = ["imas_muscle3/**"]

[tool.ty.rules]
# mypy type: ignore comments in source are not ty ignore comments; suppress noise
unused-type-ignore-comment = "ignore"

[tool.ty.analysis]
# replace imports with Any, equivalent to mypy ignore_missing_imports = true
replace-imports-with-any = [
    "imas",
    "imas_validator",
    "libmuscle",
    "muscle3",
    "muscle3_dashboard",
    "ymmsl",
    "panel",
    "param",
    "holoviews",
    "zarr",
    "matplotlib",
    "xarray",
]

[[tool.ty.overrides]]
# ignore type errors in tests and visualization examples (mypy: ignore_errors = true)
include = ["tests/**", "imas_muscle3/visualization/examples/**"]
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.unresolved-import = "ignore"
rules.unresolved-attribute = "ignore"

[[tool.ty.overrides]]
# imas IDSBase retains its name after replace-imports-with-any; attributes are dynamic
include = ["imas_muscle3/visualization/base_state.py"]
rules.unresolved-attribute = "ignore"
rules.not-iterable = "ignore"
rules.invalid-return-type = "ignore"
rules.unresolved-import = "ignore"

[[tool.ty.overrides]]
# muscle3-dashboard is editable-installed via a PEP 660 meta path finder,
# which ty's static resolver can't see (a real `pip install` lays down
# ordinary files and resolves fine); these modules just re-export or
# subclass its generic State/Plotter/recorder machinery.
include = [
    "imas_muscle3/recorder/actor.py",
    "imas_muscle3/recorder/base.py",
    "imas_muscle3/recorder/collection.py",
    "imas_muscle3/recorder/zarr_recorder.py",
    "imas_muscle3/visualization/base_plotter.py",
]
rules.unresolved-import = "ignore"

[[tool.ty.overrides]]
# imas constants (CLOSEST_INTERP etc.) typed as Unknown after replace-imports-with-any
include = ["imas_muscle3/data_sink_source.py"]
rules.invalid-return-type = "ignore"
